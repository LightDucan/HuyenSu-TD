<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="topBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24324a"/>
      <stop offset="100%" stop-color="#172236"/>
    </linearGradient>
    <linearGradient id="activeCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b2311"/>
      <stop offset="100%" stop-color="#1c160a"/>
    </linearGradient>
  </defs>

  <!-- 1. TOP HEADER HUD (Height: 48px, 3-Zone Hierarchy) -->
  <rect x="16" y="12" width="1248" height="48" rx="8" fill="url(#topBarGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Zone: Chapter & City HP -->
  <text x="32" y="42" fill="#fbbf24" font-size="16" font-weight="bold">🏯 Huyết Chiến Lãng Bạc</text>
  <rect x="230" y="24" width="120" height="24" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="242" y="40" fill="#a7f3d0" font-size="12" font-weight="bold">Thành: 10/10 HP</text>
  <text x="360" y="41" fill="#94a3b8" font-size="12">(Hạ: 14 | Thoát: 0)</text>

  <!-- Center Zone: Wave Progress -->
  <rect x="560" y="22" width="160" height="28" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="576" y="41" fill="#ffffff" font-size="14" font-weight="bold">ĐỢT 3 / 10</text>
  <rect x="656" y="26" width="54" height="20" rx="4" fill="#0369a1"/>
  <text x="664" y="40" fill="#e0f2fe" font-size="11" font-weight="bold">Đang đánh</text>

  <!-- Right Zone: Wallet & Enemy Chips -->
  <rect x="880" y="24" width="90" height="24" rx="4" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
  <text x="892" y="40" fill="#fde68a" font-size="12" font-weight="bold">🪙 1,250 Vàng</text>
  <rect x="980" y="24" width="80" height="24" rx="4" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
  <text x="990" y="40" fill="#fde68a" font-size="12" font-weight="bold">💎 45 KNB</text>

  <rect x="1075" y="24" width="55" height="24" rx="4" fill="#3f1d1d" stroke="#ef4444" stroke-width="1"/>
  <text x="1083" y="40" fill="#fca5a5" font-size="12" font-weight="bold">⚔ ×4</text>
  <rect x="1138" y="24" width="55" height="24" rx="4" fill="#3f1d1d" stroke="#ef4444" stroke-width="1"/>
  <text x="1146" y="40" fill="#fca5a5" font-size="12" font-weight="bold">🏹 ×2</text>
  <rect x="1201" y="24" width="55" height="24" rx="4" fill="#3f1d1d" stroke="#ef4444" stroke-width="1"/>
  <text x="1209" y="40" fill="#fca5a5" font-size="12" font-weight="bold">👾 ×0</text>

  <!-- 2. CENTRAL BATTLEFIELD (Dominant Height: 440px) -->
  <rect x="16" y="68" width="1248" height="440" rx="8" fill="#1b3327" stroke="#334155" stroke-width="1.5"/>

  <!-- Battlefield Path Simulation -->
  <path d="M 16 288 Q 240 288 320 180 T 640 180 T 800 380 T 1264 380" fill="none" stroke="#785330" stroke-width="64" stroke-linecap="round"/>
  <path d="M 16 288 Q 240 288 320 180 T 640 180 T 800 380 T 1264 380" fill="none" stroke="#a07142" stroke-width="56" stroke-linecap="round"/>

  <!-- Placement Tiles & Heroes (Default Range = OFF: No persistent overlay circles) -->
  <!-- Tile 1: Placed Hero (Trưng Trắc) -->
  <rect x="420" y="260" width="76" height="76" rx="6" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="2"/>
  <circle cx="458" cy="298" r="32" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2"/>
  <text x="458" y="303" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Trưng Trắc</text>

  <!-- Tile 2: Placed Hero (Trưng Nhị - HeroFocused) -->
  <rect x="700" y="100" width="76" height="76" rx="6" fill="#ca8a04" fill-opacity="0.25" stroke="#fbbf24" stroke-width="2.5"/>
  <circle cx="738" cy="138" r="32" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <text x="738" y="143" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Trưng Nhị</text>

  <!-- Tile 3: Available Empty Tile -->
  <rect x="580" y="260" width="76" height="76" rx="6" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="618" y="303" fill="#7dd3fc" font-size="11" font-weight="bold" text-anchor="middle">+ Ô Đặt</text>

  <!-- Tile 4: Target Tile for Move (Pulsing Amber) -->
  <rect x="880" y="250" width="76" height="76" rx="6" fill="#ca8a04" fill-opacity="0.2" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="918" y="293" fill="#fde047" font-size="11" font-weight="bold" text-anchor="middle">CHỌN Ô MỚI</text>

  <!-- 3. HINT / INSTRUCTION BAR (Height: 24px) -->
  <rect x="16" y="514" width="1248" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="28" y="530" fill="#93c5fd" font-size="12">💬 <tspan font-weight="bold" fill="#fde047">Hướng dẫn:</tspan> Đã chọn Trưng Nhị (Ô 2-4). Nhấn 'Di chuyển' để dời vị trí. (Click cỏ trống: PlacementIntent về neutral, giữ nguyên chọn tướng)</text>

  <!-- 4. BOTTOM CONTAINER & TAB HEADER (Height: 166px) -->
  <!-- Tab Header Buttons (Seamlessly connected to panel) -->
  <g transform="translate(16, 542)">
    <!-- Tab 1: ĐỘI HÌNH (Active) -->
    <path d="M 0 0 L 130 0 L 130 32 L 0 32 Z" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="3" fill="#fbbf24"/>
    <text x="65" y="21" fill="#fde047" font-size="13" font-weight="bold" text-anchor="middle">⚔ ĐỘI HÌNH</text>

    <!-- Tab 2: HÀNH TRANG (Inactive) -->
    <rect x="134" y="4" width="130" height="28" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="199" y="23" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="middle">🎒 HÀNH TRANG</text>
  </g>

  <!-- Main Bottom Panel Box -->
  <rect x="16" y="574" width="1248" height="134" rx="0 8 8 8" fill="url(#panelGrad)" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- LEFT REGION: 3 HERO CARDS (When ĐỘI HÌNH Tab is active) -->
  <g transform="translate(32, 586)">
    <!-- Hero Card 1: Trưng Trắc (Deployed) -->
    <rect x="0" y="0" width="280" height="110" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="10" y="10" width="70" height="90" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="45" y="60" fill="#38bdf8" font-size="18" text-anchor="middle">👸</text>
    <text x="92" y="32" fill="#ffffff" font-size="15" font-weight="bold">Trưng Trắc</text>
    <rect x="92" y="42" width="86" height="20" rx="4" fill="#064e3b"/>
    <text x="98" y="56" fill="#34d399" font-size="11" font-weight="bold">● Đã triển khai</text>
    <text x="92" y="78" fill="#94a3b8" font-size="11">Vị trí: Ô 2-4 (Sông)</text>
    <rect x="92" y="86" width="76" height="18" rx="3" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="130" y="99" fill="#93c5fd" font-size="10" font-weight="bold" text-anchor="middle">Di Chuyển</text>

    <!-- Hero Card 2: Trưng Nhị (HeroFocused & MovePending) -->
    <rect x="294" y="0" width="280" height="110" rx="8" fill="url(#activeCardGrad)" stroke="#fbbf24" stroke-width="2"/>
    <rect x="304" y="10" width="70" height="90" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="339" y="60" fill="#fbbf24" font-size="18" text-anchor="middle">🏹</text>
    <text x="386" y="32" fill="#fbbf24" font-size="15" font-weight="bold">Trưng Nhị</text>
    <rect x="386" y="42" width="96" height="20" rx="4" fill="#451a03"/>
    <text x="392" y="56" fill="#fbbf24" font-size="11" font-weight="bold">⚡ Chờ chọn ô mới</text>
    <text x="386" y="78" fill="#fde047" font-size="11">Vị trí: Ô 4-1 (Đang dời)</text>
    <rect x="386" y="86" width="76" height="18" rx="3" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="424" y="99" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle">Hủy Dời</text>

    <!-- Hero Card 3: Lê Chân (Available in Deck) -->
    <rect x="588" y="0" width="280" height="110" rx="8" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="598" y="10" width="70" height="90" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="633" y="60" fill="#f87171" font-size="18" text-anchor="middle">⚔</text>
    <text x="680" y="32" fill="#ffffff" font-size="15" font-weight="bold">Lê Chân</text>
    <rect x="680" y="42" width="76" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="686" y="56" fill="#94a3b8" font-size="11" font-weight="bold">● Trong Deck</text>
    <text x="680" y="78" fill="#94a3b8" font-size="11">Chưa trang bị / Chưa đặt</text>
    <rect x="680" y="86" width="76" height="18" rx="3" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1"/>
    <text x="718" y="99" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Triển Khai</text>
  </g>

  <!-- RIGHT REGION: PERSISTENT GLOBAL CONTROLS -->
  <g transform="translate(930, 584)">
    <rect x="0" y="0" width="318" height="114" rx="6" fill="#131d31" stroke="#334155" stroke-width="1"/>

    <!-- Row 1: Core Stats -->
    <text x="14" y="24" fill="#93c5fd" font-size="12" font-weight="bold">⚡ Quân Lệnh: <tspan fill="#ffffff">1 / 1</tspan></text>
    <text x="160" y="24" fill="#93c5fd" font-size="12" font-weight="bold">🛡 Triển Khai: <tspan fill="#ffffff">2 / 3</tspan></text>

    <!-- Row 2: Action Buttons -->
    <!-- Primary Start Wave Button -->
    <rect x="14" y="34" width="165" height="34" rx="5" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1"/>
    <text x="96" y="56" fill="#0f172a" font-size="13" font-weight="900" text-anchor="middle">▶ BẮT ĐẦU WAVE</text>

    <!-- Auto Wave Toggle Button -->
    <rect x="186" y="34" width="118" height="34" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="245" y="55" fill="#a7f3d0" font-size="11" font-weight="bold" text-anchor="middle">AUTO: BẬT</text>

    <!-- Row 3: Speed Controls, Range Toggle & Detail Modal -->
    <!-- Speed x1 / x3 -->
    <rect x="14" y="74" width="36" height="28" rx="4" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <text x="32" y="92" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">x1</text>
    <rect x="54" y="74" width="36" height="28" rx="4" fill="#eab308" stroke="#fde047" stroke-width="1"/>
    <text x="72" y="92" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">x3</text>

    <!-- Range Overlay Toggle (CONTRACT 1: DEFAULT RANGE = OFF) -->
    <rect x="96" y="74" width="94" height="28" rx="4" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <text x="143" y="92" fill="#cbd5e1" font-size="11" font-weight="bold" text-anchor="middle">🎯 Tầm: Tắt</text>

    <!-- Hero Detail Modal Trigger -->
    <rect x="196" y="74" width="108" height="28" rx="4" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
    <text x="250" y="92" fill="#93c5fd" font-size="11" font-weight="bold" text-anchor="middle">🔍 Chi Tiết</text>
  </g>
</svg>
