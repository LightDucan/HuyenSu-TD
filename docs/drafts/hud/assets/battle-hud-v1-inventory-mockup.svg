<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 200" width="1280" height="200" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="invPanelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="invSlotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24324a"/>
      <stop offset="100%" stop-color="#162032"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- TAB BAR HEADER (Height: 32px) -->
  <g transform="translate(16, 0)">
    <!-- Tab 1: ĐỘI HÌNH (Inactive) -->
    <rect x="0" y="4" width="130" height="28" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="65" y="23" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="middle">⚔ ĐỘI HÌNH</text>

    <!-- Tab 2: HÀNH TRANG (Active) -->
    <path d="M 134 0 L 264 0 L 264 32 L 134 32 Z" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="134" y="0" width="130" height="3" fill="#fbbf24"/>
    <text x="199" y="21" fill="#fde047" font-size="13" font-weight="bold" text-anchor="middle">🎒 HÀNH TRANG</text>

    <!-- Running Wave Lock Indicator -->
    <rect x="274" y="6" width="160" height="24" rx="4" fill="#3f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="284" y="22" fill="#fca5a5" font-size="11" font-weight="bold">🔒 Khóa đổi đồ khi đánh wave</text>
  </g>

  <!-- MAIN BOTTOM PANEL BOX -->
  <rect x="16" y="32" width="1248" height="156" rx="0 8 8 8" fill="url(#invPanelGrad)" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- REGION 1: CURRENT HERO LOADOUT QUICK VIEW (Width: ~270px) -->
  <g transform="translate(32, 44)">
    <rect x="0" y="0" width="260" height="132" rx="6" fill="#131d31" stroke="#334155" stroke-width="1"/>

    <!-- Hero Selector Header -->
    <text x="12" y="22" fill="#94a3b8" font-size="12">Trang bị của: <tspan fill="#fbbf24" font-weight="bold">Trưng Trắc</tspan></text>

    <!-- Hero Mini Pill Switches -->
    <rect x="12" y="30" width="70" height="22" rx="3" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
    <text x="47" y="45" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Trưng Trắc</text>

    <rect x="88" y="30" width="70" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="123" y="45" fill="#94a3b8" font-size="10" text-anchor="middle">Trưng Nhị</text>

    <rect x="164" y="30" width="70" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="199" y="45" fill="#94a3b8" font-size="10" text-anchor="middle">Lê Chân</text>

    <!-- 2 Dedicated Loadout Slots: Weapon & Gem -->
    <!-- Slot 1: Weapon (Equipped) -->
    <g transform="translate(12, 60)">
      <rect x="0" y="0" width="112" height="62" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="8" y="16" fill="#6ee7b7" font-size="10" font-weight="bold">⚔ VŨ KHÍ</text>
      <text x="8" y="34" fill="#ffffff" font-size="12" font-weight="bold">Trống Đồng</text>
      <text x="8" y="48" fill="#94a3b8" font-size="10">Lv3 · ATK +35</text>
      <rect x="74" y="6" width="30" height="16" rx="3" fill="#7f1d1d"/>
      <text x="89" y="18" fill="#fca5a5" font-size="9" font-weight="bold" text-anchor="middle">Gỡ</text>
    </g>

    <!-- Slot 2: Gem (Empty) -->
    <g transform="translate(136, 60)">
      <rect x="0" y="0" width="112" height="62" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="8" y="16" fill="#94a3b8" font-size="10" font-weight="bold">💎 NGỌC</text>
      <text x="56" y="38" fill="#64748b" font-size="11" text-anchor="middle">+ Trống</text>
      <text x="56" y="52" fill="#475569" font-size="9" text-anchor="middle">Chưa gắn Ngọc</text>
    </g>
  </g>

  <!-- REGION 2: INVENTORY GRID SLOTS (Width: ~590px, Scrollable) -->
  <g transform="translate(306, 44)">
    <rect x="0" y="0" width="600" height="132" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="14" y="18" fill="#cbd5e1" font-size="11" font-weight="bold">Kho Trang Bị (6/20) · <tspan fill="#94a3b8" font-weight="normal">Nhấn vào trang bị để thao tác</tspan></text>

    <!-- Item Slot 1: Vu Khi (Selected) -->
    <g transform="translate(14, 26)">
      <rect x="0" y="0" width="105" height="96" rx="6" fill="#2b2311" stroke="#fbbf24" stroke-width="2"/>
      <text x="8" y="18" fill="#fde047" font-size="10" font-weight="bold">⚔ VŨ KHÍ</text>
      <text x="8" y="36" fill="#ffffff" font-size="12" font-weight="bold">Trống Đồng</text>
      <text x="8" y="52" fill="#38bdf8" font-size="10">Lv3 · ATK +35</text>
      <rect x="8" y="60" width="89" height="16" rx="3" fill="#064e3b"/>
      <text x="12" y="72" fill="#34d399" font-size="9">Trưng Trắc dùng</text>
      <rect x="8" y="78" width="89" height="14" rx="2" fill="#7f1d1d"/>
      <text x="52" y="89" fill="#fca5a5" font-size="9" text-anchor="middle">Tháo gỡ</text>
    </g>

    <!-- Item Slot 2: Vu Khi (Available to Equip) -->
    <g transform="translate(129, 26)">
      <rect x="0" y="0" width="105" height="96" rx="6" fill="url(#invSlotGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="8" y="18" fill="#93c5fd" font-size="10" font-weight="bold">⚔ VŨ KHÍ</text>
      <text x="8" y="36" fill="#ffffff" font-size="12" font-weight="bold">Lạc Long Kiếm</text>
      <text x="8" y="52" fill="#38bdf8" font-size="10">Lv1 · ATK +12</text>
      <text x="8" y="68" fill="#94a3b8" font-size="9">Túi đồ (Rảnh)</text>
      <rect x="8" y="74" width="89" height="18" rx="3" fill="#1d4ed8"/>
      <text x="52" y="87" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Lắp vào</text>
    </g>

    <!-- Item Slot 3: Ngoc (Mergeable Leader) -->
    <g transform="translate(244, 26)">
      <rect x="0" y="0" width="105" height="96" rx="6" fill="url(#invSlotGrad)" stroke="#a855f7" stroke-width="1.5"/>
      <text x="8" y="18" fill="#d8b4fe" font-size="10" font-weight="bold">💎 NGỌC</text>
      <text x="8" y="36" fill="#ffffff" font-size="12" font-weight="bold">Hồng Ngọc</text>
      <text x="8" y="52" fill="#38bdf8" font-size="10">Lv1 · Range +8</text>
      <rect x="8" y="60" width="89" height="14" rx="2" fill="#4c1d95"/>
      <text x="52" y="71" fill="#e9d5ff" font-size="9" text-anchor="middle">Có 3 viên Lv1</text>
      <rect x="8" y="76" width="89" height="16" rx="3" fill="#7c3aed"/>
      <text x="52" y="88" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Ghép 3 → Lv2</text>
    </g>

    <!-- Item Slot 4: Ngoc (Available to Equip) -->
    <g transform="translate(359, 26)">
      <rect x="0" y="0" width="105" height="96" rx="6" fill="url(#invSlotGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="8" y="18" fill="#d8b4fe" font-size="10" font-weight="bold">💎 NGỌC</text>
      <text x="8" y="36" fill="#ffffff" font-size="12" font-weight="bold">Bích Ngọc</text>
      <text x="8" y="52" fill="#38bdf8" font-size="10">Lv2 · Spd +5%</text>
      <text x="8" y="68" fill="#94a3b8" font-size="9">Túi đồ (Rảnh)</text>
      <rect x="8" y="74" width="89" height="18" rx="3" fill="#1d4ed8"/>
      <text x="52" y="87" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Lắp vào</text>
    </g>

    <!-- Item Slot 5: Empty Slot -->
    <g transform="translate(474, 26)">
      <rect x="0" y="0" width="105" height="96" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="52" y="54" fill="#334155" font-size="16" text-anchor="middle">🔒</text>
      <text x="52" y="72" fill="#475569" font-size="10" text-anchor="middle">Ô trống</text>
    </g>
  </g>

  <!-- REGION 3: GLOBAL CONTROLS (Identical Right Region) -->
  <g transform="translate(930, 42)">
    <rect x="0" y="0" width="318" height="134" rx="6" fill="#131d31" stroke="#334155" stroke-width="1"/>

    <text x="14" y="24" fill="#93c5fd" font-size="12" font-weight="bold">⚡ Quân Lệnh: <tspan fill="#ffffff">1 / 1</tspan></text>
    <text x="160" y="24" fill="#93c5fd" font-size="12" font-weight="bold">🛡 Triển Khai: <tspan fill="#ffffff">2 / 3</tspan></text>

    <!-- Start Wave Button (Disabled during wave) -->
    <rect x="14" y="34" width="165" height="34" rx="5" fill="#475569" stroke="#64748b" stroke-width="1" opacity="0.6"/>
    <text x="96" y="56" fill="#cbd5e1" font-size="13" font-weight="bold" text-anchor="middle">ĐANG CHẠY WAVE</text>

    <rect x="186" y="34" width="118" height="34" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="245" y="55" fill="#a7f3d0" font-size="11" font-weight="bold" text-anchor="middle">AUTO: BẬT</text>

    <rect x="14" y="74" width="36" height="28" rx="4" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <text x="32" y="92" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">x1</text>
    <rect x="54" y="74" width="36" height="28" rx="4" fill="#eab308" stroke="#fde047" stroke-width="1"/>
    <text x="72" y="92" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">x3</text>

    <rect x="96" y="74" width="94" height="28" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <text x="143" y="92" fill="#bfdbfe" font-size="11" font-weight="bold" text-anchor="middle">🎯 Tầm: Bật</text>

    <rect x="196" y="74" width="108" height="28" rx="4" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
    <text x="250" y="92" fill="#93c5fd" font-size="11" font-weight="bold" text-anchor="middle">🔍 Chi Tiết</text>

    <text x="14" y="122" fill="#94a3b8" font-size="10">💡 Nhấn 'ĐỘI HÌNH' để quay lại chọn tướng.</text>
  </g>
</svg>
